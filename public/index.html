<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ELDGAGA APP" />
  <meta name="description" content="ELDGAGA APP" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/app-icon.png" />
  <link rel="apple-touch-icon" href="/app-icon.png" />
  <title>ELDGAGA APP</title>
  <script>
    try {
      var m = localStorage.getItem("theme_mode");
      if (!m) m = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = m;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/theme.js"></script>
</head>
<body class="page-index">
  <div class="splash" id="splash">
    <div class="splash-logo" id="splashLogo">✓</div>
    <div class="splash-name" id="splashName" data-label="title">ELDGAGA APP</div>
    <div class="splash-spinner"></div>
  </div>
  <div class="bg-logo" id="bgLogo" aria-hidden="true"></div>
  <div class="app-shell">
    <!-- ===== الشريط العلوي (الموبايل) ===== -->
    <header class="app-bar">
      <div class="app-bar-title">
        <span class="brand-icon">✓</span>
        <span data-label="title">ELDGAGA APP</span>
      </div>
      <div class="app-bar-actions">
        <a class="logo-btn" href="/" data-label-title="back_home" title="الشاشة الرئيسية">
          <img id="brandLogoImg" alt="" />
        </a>
        <span class="icon-btn ghost-light" title="البث المباشر"><span class="live-dot"></span></span>
        <button class="icon-btn" id="themeToggle" title="الوضع الليلي">🌙</button>
        <button class="icon-btn" id="installBtn" title="تثبيت التطبيق" style="display:none">⬇️</button>
      </div>
    </header>

    <!-- ===== الشريط الجانبي (سطح المكتب) ===== -->
    <aside class="sidebar">
      <a class="brand" href="/" style="text-decoration:none;color:inherit" data-label-title="back_home" title="الشاشة الرئيسية">
        <span class="brand-icon" id="brandIconDefault">✓</span>
        <img id="brandLogoImgSide" class="brand-logo" alt="" style="display:none" />
        <span class="brand-title" data-label="title">ELDGAGA APP</span>
      </a>
      <nav>
        <button class="nav-item active" data-view="new">
          <span class="nav-icon">📝</span><span data-label="nav_new">تقرير جديد</span>
        </button>
        <a class="nav-item" href="/reports">
          <span class="nav-icon">📊</span><span data-label="nav_reports">التقارير</span>
        </a>
        <a class="nav-item" href="/admin">
          <span class="nav-icon">⚙️</span><span data-label="nav_admin">لوحة التحكم</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="live-status">
          <span class="live-dot" id="liveDot"></span>
          <span id="liveStatusText" data-label="live_status">متصل بالبث المباشر</span>
        </div>
      </div>
    </aside>

    <!-- ===== المحتوى ===== -->
    <main class="main">
      <!-- تقرير جديد -->
      <section id="view-new" class="view active">
        <div class="page-header">
          <div>
            <h1 data-label="new_report">تقرير فحص جديد</h1>
            <div class="subtitle" id="todayHint"></div>
          </div>
        </div>

        <div class="card card-hover">
          <div class="card-title"><span><span class="title-icon">🗓️</span><span data-label="date_label">التاريخ</span></span></div>
          <div class="form-row">
            <div class="field">
              <label data-label="date_label">التاريخ</label>
              <input type="date" id="reportDate" />
            </div>
            <div class="field">
              <label data-label="shift_label">الوردية</label>
              <div class="chip-group" id="shiftChips"></div>
            </div>
          </div>
        </div>

        <div id="checklistContainer"></div>

        <div class="card card-hover">
          <div class="card-title"><span><span class="title-icon">💰</span><span data-label="penalties_label">الجزاءات</span></span></div>
          <div class="chip-group" id="penaltyChips"></div>
          <div id="penaltyRows"></div>
        </div>

        <div class="card card-hover">
          <div class="field">
            <label data-label="general_notes">ملاحظات عامة</label>
            <textarea id="reportNotes" rows="3" data-label-placeholder="notes_placeholder"></textarea>
          </div>
          <button class="btn btn-success btn-block" id="saveReportBtn"><span data-label="save_report">حفظ التقرير</span></button>
        </div>
      </section>
    </main>
  </div>

  <!-- ===== القائمة السفلية (الموبايل) ===== -->
  <nav class="bottom-nav">
    <button class="bottom-nav-item active" data-view="new">
      <span class="bn-icon">📝</span><span data-label="nav_new">تقرير جديد</span>
    </button>
    <a class="bottom-nav-item" href="/reports">
      <span class="bn-icon">📊</span><span data-label="nav_reports">التقارير</span>
    </a>
    <a class="bottom-nav-item" href="/admin">
      <span class="bn-icon">⚙️</span><span data-label="nav_admin">لوحة التحكم</span>
    </a>
  </nav>

  <div class="toast-wrap" id="toastWrap"></div>

  <script src="js/pwa.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
